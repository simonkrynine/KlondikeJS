<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solitaire</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
</head>
<body>
  <header class="top-bar">
    <h1>Solitaire</h1>
    <div id="stats" class="stats">Moves: 0 | Time: 00:00</div>
    <div class="controls">
      <button id="btn-new-game">New Game</button>
      <button id="btn-undo">Undo</button>
    </div>
  </header>
  <main>
    <div class="control-row">
      <div id="stock" class="pile"></div>
      <div id="waste" class="pile"></div>
      <div class="gap"></div>
      <div id="foundation-0" class="pile foundation"></div>
      <div id="foundation-1" class="pile foundation"></div>
      <div id="foundation-2" class="pile foundation"></div>
      <div id="foundation-3" class="pile foundation"></div>
    </div>
    <div class="tableau-row">
      <div id="tableau-0" class="tableau-col"></div>
      <div id="tableau-1" class="tableau-col"></div>
      <div id="tableau-2" class="tableau-col"></div>
      <div id="tableau-3" class="tableau-col"></div>
      <div id="tableau-4" class="tableau-col"></div>
      <div id="tableau-5" class="tableau-col"></div>
      <div id="tableau-6" class="tableau-col"></div>
    </div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
