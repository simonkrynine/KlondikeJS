<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solitaire</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
</head>
<body>
  <header class="top-bar">
    <h1>Solitaire</h1>
    <div id="stats" class="stats">Moves: 0 | Time: 00:00</div>
    <div class="controls">
      <button id="btn-rules">Rules</button>
      <button id="btn-new-game">New Game</button>
    </div>
  </header>
  <main>
    <div id="control-row" class="control-row"></div>
    <div id="play-area"   class="tableau-row"></div>
    <div id="rules-overlay" class="rules-overlay hidden">
      <div class="rules-box">
        <ul id="rules-list"></ul>
        <button id="btn-rules-ok">OK</button>
      </div>
    </div>
  </main>
<div id="win-overlay" class="win-overlay hidden">
    <div id="win-confetti"></div>
    <div class="win-box">
      <h2>You Win!</h2>
      <button id="btn-play-again">Play Again</button>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
